name: "cairnlock"
description: "Static analyzer and lockfile for AI-agent context files. Writes SARIF for GitHub Code Scanning."
branding:
  icon: "lock"
  color: "green"

inputs:
  path:
    description: "Repository path to scan"
    required: false
    default: "."
  output:
    description: "SARIF output file"
    required: false
    default: "cairnlock.sarif"
  fail:
    description: "Fail the step when findings exceed the threshold (true/false)"
    required: false
    default: "true"
  fail-on:
    description: "Severity threshold for failing: low, medium, high, or never"
    required: false
    default: "low"
  profile:
    description: "Rule set: core (agent files, default) or extended (adds source and dependency files)"
    required: false
    default: "core"
  base-ref:
    description: "Git ref to read the base cairnlock.lock from; runs verify --base when set"
    required: false
    default: ""
  allow-lock-change:
    description: "Do not fail verify when cairnlock.lock itself differs from base-ref (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: |
        pip install "cairnlock @ git+https://github.com/${{ github.action_repository }}.git@${{ github.action_ref }}"
    - name: Verify lockfile
      shell: bash
      run: |
        if [ ! -f cairnlock.lock ]; then
          echo "no cairnlock.lock in this repository; skipping verify (run 'cairnlock init' to adopt)"
          exit 0
        fi
        if [ -n "${{ inputs.base-ref }}" ]; then
          if [ "${{ inputs.allow-lock-change }}" = "true" ]; then
            cairnlock verify --base "${{ inputs.base-ref }}" --allow-lock-change
          else
            cairnlock verify --base "${{ inputs.base-ref }}"
          fi
        else
          cairnlock verify
        fi
    - name: Scan
      shell: bash
      run: |
        if [ "${{ inputs.fail }}" = "true" ]; then
          cairnlock scan "${{ inputs.path }}" --profile "${{ inputs.profile }}" --format sarif --output "${{ inputs.output }}" \
            --fail-on "${{ inputs.fail-on }}" --no-progress --no-banner
        else
          cairnlock scan "${{ inputs.path }}" --profile "${{ inputs.profile }}" --format sarif --output "${{ inputs.output }}" \
            --fail-on "${{ inputs.fail-on }}" --no-fail --no-progress --no-banner
        fi
